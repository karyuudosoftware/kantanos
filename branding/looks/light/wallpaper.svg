<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <title>KantanOS wallpaper - light</title>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f9fd"/>
      <stop offset="0.55" stop-color="#eaf0f8"/>
      <stop offset="1" stop-color="#dde7f5"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="170"/></filter>
    <filter id="blurSoft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="90"/></filter>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3cc4f5" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#3cc4f5" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#3b82f6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#2f5fe0" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="3840" height="2160" fill="url(#base)"/>
  <g filter="url(#blur)">
    <ellipse cx="820" cy="1500" rx="900" ry="520" fill="#a9d8ff" opacity="0.75"/>
    <ellipse cx="2050" cy="1250" rx="950" ry="520" fill="#b9cdfa" opacity="0.7"/>
    <ellipse cx="3150" cy="820" rx="820" ry="560" fill="#c9d6ff" opacity="0.65"/>
    <ellipse cx="1500" cy="300" rx="700" ry="300" fill="#ffffff" opacity="0.8"/>
  </g>
  <g filter="url(#blurSoft)" fill="none" stroke="url(#ribbon)" stroke-linecap="round">
    <path d="M -200 1750 C 900 1250, 1700 1900, 2500 1250 S 3700 600, 4100 760" stroke-width="150"/>
    <path d="M -200 1380 C 800 980, 1900 1500, 2700 900 S 3800 380, 4100 420" stroke-width="70" opacity="0.6"/>
  </g>
  <rect width="3840" height="2160" fill="#ffffff" opacity="0.18"/>
</svg>
