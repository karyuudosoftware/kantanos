<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <title>KantanOS wallpaper - ocean</title>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1728"/>
      <stop offset="0.55" stop-color="#07101c"/>
      <stop offset="1" stop-color="#0c1d36"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="170"/></filter>
    <filter id="blurSoft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="90"/></filter>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6fd6ff" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#6fd6ff" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#3b9dff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#2b6fe6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="3840" height="2160" fill="url(#base)"/>
  <g filter="url(#blur)">
    <ellipse cx="820" cy="1500" rx="900" ry="520" fill="#1c8fd6" opacity="0.5"/>
    <ellipse cx="2050" cy="1250" rx="950" ry="520" fill="#2463c9" opacity="0.55"/>
    <ellipse cx="3150" cy="820" rx="820" ry="560" fill="#1aa3c9" opacity="0.48"/>
    <ellipse cx="1500" cy="300" rx="700" ry="300" fill="#173a7a" opacity="0.45"/>
  </g>
  <g filter="url(#blurSoft)" fill="none" stroke="url(#ribbon)" stroke-linecap="round">
    <path d="M -200 1750 C 900 1250, 1700 1900, 2500 1250 S 3700 600, 4100 760" stroke-width="150"/>
    <path d="M -200 1380 C 800 980, 1900 1500, 2700 900 S 3800 380, 4100 420" stroke-width="70" opacity="0.6"/>
  </g>
  <rect width="3840" height="2160" fill="#07101c" opacity="0.18"/>
</svg>
