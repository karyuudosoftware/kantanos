<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200" viewBox="0 0 320 200">
  <defs>
    <style id="current-color-scheme" type="text/css">
      .ColorScheme-Text { color:#fcfcfc; }
      .ColorScheme-Background { color:#141618; }
    </style>
  </defs>
  <!-- visible frame -->
  <g id="topleft"><path d="M10,28 A18,18 0 0 1 28,10 L28,28 Z" class="ColorScheme-Background" fill="currentColor" fill-opacity="1.0"/><path d="M10,28 A18,18 0 0 1 28,10 L28,11 A17,17 0 0 0 11,28 Z" fill="#ffffff" fill-opacity="0.1"/></g>
  <g id="topright"><path d="M64,10 A18,18 0 0 1 82,28 L64,28 Z" class="ColorScheme-Background" fill="currentColor" fill-opacity="1.0"/><path d="M64,10 A18,18 0 0 1 82,28 L81,28 A17,17 0 0 0 64,11 Z" fill="#ffffff" fill-opacity="0.1"/></g>
  <g id="bottomleft"><path d="M10,64 A18,18 0 0 0 28,82 L28,64 Z" class="ColorScheme-Background" fill="currentColor" fill-opacity="1.0"/><path d="M10,64 A18,18 0 0 0 28,82 L28,81 A17,17 0 0 1 11,64 Z" fill="#ffffff" fill-opacity="0.1"/></g>
  <g id="bottomright"><path d="M64,82 A18,18 0 0 0 82,64 L64,64 Z" class="ColorScheme-Background" fill="currentColor" fill-opacity="1.0"/><path d="M64,82 A18,18 0 0 0 82,64 L81,64 A17,17 0 0 1 64,81 Z" fill="#ffffff" fill-opacity="0.1"/></g>
  <g id="top"><rect x="28" y="10" width="36" height="18" class="ColorScheme-Background" fill="currentColor" fill-opacity="1.0"/><rect x="28" y="10" width="36" height="1" fill="#ffffff" fill-opacity="0.1"/></g>
  <g id="bottom"><rect x="28" y="64" width="36" height="18" class="ColorScheme-Background" fill="currentColor" fill-opacity="1.0"/><rect x="28" y="81" width="36" height="1" fill="#ffffff" fill-opacity="0.1"/></g>
  <g id="left"><rect x="10" y="28" width="18" height="36" class="ColorScheme-Background" fill="currentColor" fill-opacity="1.0"/><rect x="10" y="28" width="1" height="36" fill="#ffffff" fill-opacity="0.1"/></g>
  <g id="right"><rect x="64" y="28" width="18" height="36" class="ColorScheme-Background" fill="currentColor" fill-opacity="1.0"/><rect x="81" y="28" width="1" height="36" fill="#ffffff" fill-opacity="0.1"/></g>
  <rect id="center" x="28" y="28" width="36" height="36" class="ColorScheme-Background" fill="currentColor" fill-opacity="1.0"/>
  <!-- mask: the area that gets blurred behind the panel -->
  <g id="mask-topleft"><path d="M110,28 A18,18 0 0 1 128,10 L128,28 Z" fill="#000000"/></g>
  <g id="mask-topright"><path d="M164,10 A18,18 0 0 1 182,28 L164,28 Z" fill="#000000"/></g>
  <g id="mask-bottomleft"><path d="M110,64 A18,18 0 0 0 128,82 L128,64 Z" fill="#000000"/></g>
  <g id="mask-bottomright"><path d="M164,82 A18,18 0 0 0 182,64 L164,64 Z" fill="#000000"/></g>
  <g id="mask-top"><rect x="128" y="10" width="36" height="18" fill="#000000"/></g>
  <g id="mask-bottom"><rect x="128" y="64" width="36" height="18" fill="#000000"/></g>
  <g id="mask-left"><rect x="110" y="28" width="18" height="36" fill="#000000"/></g>
  <g id="mask-right"><rect x="164" y="28" width="18" height="36" fill="#000000"/></g>
  <rect id="mask-center" x="128" y="28" width="36" height="36" fill="#000000"/>
  <!-- content margins -->
  <rect id="hint-top-margin" x="200" y="10" width="5" height="5" fill="#ff00ff" opacity="0"/>
  <rect id="hint-bottom-margin" x="212" y="10" width="5" height="5" fill="#ff00ff" opacity="0"/>
  <rect id="hint-left-margin" x="224" y="10" width="5" height="5" fill="#ff00ff" opacity="0"/>
  <rect id="hint-right-margin" x="236" y="10" width="5" height="5" fill="#ff00ff" opacity="0"/>
  <!-- stretch the edge pieces instead of tiling them (tiling shows seams) -->
  <rect id="hint-stretch-borders" x="200" y="30" width="4" height="4" fill="#ff00ff" opacity="0"/>
</svg>
