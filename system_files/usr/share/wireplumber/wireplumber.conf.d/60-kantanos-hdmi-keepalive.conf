# KantanOS: keep HDMI and DisplayPort audio running all the time.
#
# Normally the sound system closes an output after 5 seconds of silence. An AV receiver
# then drops its audio lock, and the first second or two of the next sound is lost while it
# locks on again (on Windows this is what "keep HDMI audio awake" apps fix). Here those
# outputs never close, and a tiny inaudible noise keeps receivers that watch for digital
# silence from going to sleep too.
#
# Turn it off for one user with: ujust kantan-hdmi-keepalive off

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*hdmi.*" }
      { node.name = "~alsa_output.*HDMI.*" }
      { node.name = "~alsa_output.*displayport.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        dither.noise = 1
      }
    }
  }
]
