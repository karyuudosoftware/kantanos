# KantanOS: let HDMI and DisplayPort outputs carry Dolby and DTS sound untouched
# ("pass-through" or "bitstream"), so an AV receiver gets Dolby Atmos (TrueHD, E-AC-3),
# DTS:X / DTS-HD and the rest, and decodes them itself.
#
# This only allows it: normal sound is unchanged. A player has to ask for pass-through, such
# as KantanOS's "Movie Player (Dolby Atmos)" (mpv), or VLC with
# Preferences → Audio → "HDMI/SPDIF audio passthrough" set to "Enabled (HD)".

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*hdmi.*" }
      { node.name = "~alsa_output.*HDMI.*" }
      { node.name = "~alsa_output.*displayport.*" }
    ]
    actions = {
      update-props = {
        iec958.codecs = [ PCM AC3 DTS EAC3 TrueHD DTS-HD ]
      }
    }
  }
]
