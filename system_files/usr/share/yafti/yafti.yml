title: KantanOS Welcome
screens:
  - title: "Welcome!"
    description: "Get started with KantanOS"
    hidden: true
    actions:
      - id: "store"
        title: "Open the app store"
        description: "Browse and install thousands of apps."
        default: false
        script: "nohup setsid gtk4-launch io.github.kolunmi.Bazaar >&/dev/null"
      - id: "japanese"
        title: "Type in Japanese"
        description: "Japanese input is already installed. Press Ctrl+Space in any text box to switch between English and Japanese."
        default: false
        script: "nohup setsid fcitx5-configtool >&/dev/null"
      - id: "update"
        title: "Check for updates"
        description: "Update KantanOS and your apps. A restart applies system updates; the previous version stays available as a fallback."
        default: false
        script: "ujust update; echo; echo \"Press Enter to close...\"; read -r _"
      - id: "about"
        title: "About this PC"
        description: "Show the KantanOS version and system details."
        default: false
        script: "nohup setsid kinfocenter >&/dev/null"
  - title: "Look"
    description: "Pick a colour style. It changes the wallpaper, colours and icons straight away."
    actions:
      - id: "look-light"
        title: "Light"
        description: "Light style. This is the one KantanOS starts with."
        default: false
        script: "kantan-look set light"
      - id: "look-sakura"
        title: "Sakura"
        description: "Light style."
        default: false
        script: "kantan-look set sakura"
      - id: "look-graphite"
        title: "Graphite"
        description: "Dark style."
        default: false
        script: "kantan-look set graphite"
      - id: "look-ocean"
        title: "Ocean"
        description: "Dark style."
        default: false
        script: "kantan-look set ocean"
      - id: "look-forest"
        title: "Forest"
        description: "Dark style."
        default: false
        script: "kantan-look set forest"
      - id: "look-ember"
        title: "Ember"
        description: "Dark style."
        default: false
        script: "kantan-look set ember"
      - id: "look-aurora"
        title: "Aurora"
        description: "Dark style."
        default: false
        script: "kantan-look set aurora"
  - title: "Office"
    description: "Documents, notes and email"
    actions:
      - id: "libreoffice"
        title: "LibreOffice"
        description: "Word processor, spreadsheets and presentations. Opens and saves Microsoft Office files."
        default: false
        status_script: "kantan-app status org.libreoffice.LibreOffice"
        options:
          - id: "install"
            label: "Install LibreOffice"
            script: "kantan-app install org.libreoffice.LibreOffice"
          - id: "uninstall"
            label: "Remove LibreOffice"
            script: "kantan-app uninstall org.libreoffice.LibreOffice"
      - id: "notepadnext"
        title: "NotepadNext"
        description: "A Notepad++ style text editor that runs natively."
        default: false
        status_script: "kantan-app status com.github.dail8859.NotepadNext"
        options:
          - id: "install"
            label: "Install NotepadNext"
            script: "kantan-app install com.github.dail8859.NotepadNext"
          - id: "uninstall"
            label: "Remove NotepadNext"
            script: "kantan-app uninstall com.github.dail8859.NotepadNext"
      - id: "thunderbird"
        title: "Thunderbird"
        description: "Email and calendar."
        default: false
        status_script: "kantan-app status org.mozilla.Thunderbird"
        options:
          - id: "install"
            label: "Install Thunderbird"
            script: "kantan-app install org.mozilla.Thunderbird"
          - id: "uninstall"
            label: "Remove Thunderbird"
            script: "kantan-app uninstall org.mozilla.Thunderbird"
  - title: "Creative"
    description: "Photos, drawing, video and audio"
    actions:
      - id: "krita"
