title: KantanOS Welcome
screens:
  - title: "Welcome!"
    description: "Get started with KantanOS"
    hidden: true
    actions:
      - id: "store"
        title: "Open the app store"
        description: "Browse and install thousands of apps."
        default: false
        script: "nohup setsid gtk4-launch io.github.kolunmi.Bazaar >&/dev/null"
      - id: "japanese"
        title: "Type in Japanese"
        description: "Japanese input is already installed. Press Ctrl+Space in any text box to switch between English and Japanese."
        default: false
        script: "nohup setsid fcitx5-configtool >&/dev/null"
      - id: "phone"
        title: "Connect your Android phone"
        description: "See phone notifications on the PC, share files and the clipboard, use the phone as a remote. Install KDE Connect on the phone from the Play Store, then pair it here."
        default: false
        script: "nohup setsid kdeconnect-app >&/dev/null"
      - id: "android"
        title: "Android apps"
        description: "Run Android apps on this PC in their own windows, listed in your apps menu. Set up once (downloads about 1 GB), then double-click any .apk file to install it."
        default: false
        script: "nohup setsid kantan-android setup >&/dev/null"
      - id: "home"
        title: "Smart home"
        description: "See and change the house temperature from the top bar, for example a Google Nest thermostat, through Home Assistant (free; runs in your home or on this PC)."
        default: false
        script: "nohup setsid kantan-home >&/dev/null"
      - id: "nas"
        title: "Connect your NAS"
        description: "Make the shared folders on your NAS (for example a TrueNAS box) work like normal folders in every app. Asks for the NAS user name and password once."
        default: false
        script: "nohup setsid /usr/libexec/kantanos/nas-connect --window >&/dev/null"
      - id: "wake"
        title: "Wake this PC from another device"
        description: "Shows the details a wake-up app needs to switch this PC on over the network (Wake-on-LAN)."
        default: false
        script: "nohup setsid /usr/libexec/kantanos/task-window --title 'Wake this PC from another device' --doing 'Looking up this PC'\"'\"'s network details' --done 'Details for your wake-up app' --failed 'Wake-on-LAN needs a network cable' --show-output -- ujust kantan-wake-info >&/dev/null"
      - id: "update"
        title: "Check for updates"
        description: "Update KantanOS and your apps. A restart applies system updates; the previous version stays available as a fallback."
        default: false
        script: "nohup setsid /usr/libexec/kantanos/update-window >&/dev/null"
      - id: "undo-update"
        title: "Undo the last update"
        description: "If something stopped working after an update, go back to the version from before it. Takes effect when the PC restarts. Needs the PC's password."
        default: false
        script: "nohup setsid /usr/libexec/kantanos/task-window --title 'Undo the last update' --doing 'Getting the previous version ready' --done 'The previous version is ready. Restart the PC to go back to it.' --failed 'It couldn'\"'\"'t go back (the PC'\"'\"'s password wasn'\"'\"'t given, or there is no earlier version on this PC).' --ask 'Go back to the version of KantanOS from before the last update? Your files and apps stay as they are; only KantanOS itself goes back. This happens when the PC restarts.' --restart -- pkexec bootc rollback >&/dev/null"
      - id: "about"
        title: "About this PC"
        description: "Show the KantanOS version and system details."
        default: false
        script: "nohup setsid kinfocenter >&/dev/null"
  - title: "Look"
    description: "Pick a colour style. It changes the wallpaper, colours and icons straight away."
    actions:
      - id: "look-light"
        title: "Light"
        description: "Light style. This is the one KantanOS starts with."
        default: false
        script: "kantan-look set light"
      - id: "look-sakura"
        title: "Sakura"
        description: "Light style."
        default: false
        script: "kantan-look set sakura"
      - id: "look-graphite"
        title: "Graphite"
        description: "Dark style."
        default: false
        script: "kantan-look set graphite"
      - id: "look-ocean"
        title: "Ocean"
        description: "Dark style."
        default: false
        script: "kantan-look set ocean"
      - id: "look-forest"
        title: "Forest"
        description: "Dark style."
        default: false
        script: "kantan-look set forest"
      - id: "look-ember"
        title: "Ember"
        description: "Dark style."
        default: false
        script: "kantan-look set ember"
      - id: "look-aurora"
        title: "Aurora"
        description: "Dark style."
        default: false
        script: "kantan-look set aurora"
  - title: "Office"
    description: "Documents, notes and email"
    actions:
      - id: "libreoffice"
        title: "LibreOffice"
        description: "Word processor, spreadsheets and presentations. Opens and saves Microsoft Office files."
        default: false
        status_script: "kantan-app status org.libreoffice.LibreOffice"
        options:
          - id: "uninstall"
            label: "Install LibreOffice"
            script: "kantan-app install org.libreoffice.LibreOffice"
          - id: "remove-app"
            label: "Remove LibreOffice"
            script: "kantan-app uninstall org.libreoffice.LibreOffice"
      - id: "notepadnext"
        title: "NotepadNext"
        description: "A Notepad++ style text editor that runs natively."
        default: false
        status_script: "kantan-app status com.github.dail8859.NotepadNext"
        options:
          - id: "uninstall"
            label: "Install NotepadNext"
            script: "kantan-app install com.github.dail8859.NotepadNext"
          - id: "remove-app"
            label: "Remove NotepadNext"
            script: "kantan-app uninstall com.github.dail8859.NotepadNext"
      - id: "thunderbird"
        title: "Thunderbird"
        description: "Email and calendar."
        default: false
        status_script: "kantan-app status org.mozilla.thunderbird"
        options:
          - id: "uninstall"
            label: "Install Thunderbird"
            script: "kantan-app install org.mozilla.thunderbird"
          - id: "remove-app"
            label: "Remove Thunderbird"
            script: "kantan-app uninstall org.mozilla.thunderbird"
  - title: "Creative"
    description: "Photos, drawing, video and audio"
    actions:
      - id: "krita"
        title: "Krita"
        description: "Digital painting and drawing."
        default: false
        status_script: "kantan-app status org.kde.krita"
        options:
          - id: "uninstall"
            label: "Install Krita"
            script: "kantan-app install org.kde.krita"
          - id: "remove-app"
            label: "Remove Krita"
            script: "kantan-app uninstall org.kde.krita"
      - id: "gimp"
        title: "GIMP"
        description: "Photo editing."
        default: false
        status_script: "kantan-app status org.gimp.GIMP"
        options:
          - id: "uninstall"
            label: "Install GIMP"
            script: "kantan-app install org.gimp.GIMP"
          - id: "remove-app"
            label: "Remove GIMP"
            script: "kantan-app uninstall org.gimp.GIMP"
      - id: "inkscape"
        title: "Inkscape"
        description: "Vector illustration."
        default: false
        status_script: "kantan-app status org.inkscape.Inkscape"
        options:
          - id: "uninstall"
            label: "Install Inkscape"
            script: "kantan-app install org.inkscape.Inkscape"
          - id: "remove-app"
            label: "Remove Inkscape"
            script: "kantan-app uninstall org.inkscape.Inkscape"
      - id: "kdenlive"
        title: "Kdenlive"
        description: "Video editing."
        default: false
        status_script: "kantan-app status org.kde.kdenlive"
        options:
          - id: "uninstall"
            label: "Install Kdenlive"
            script: "kantan-app install org.kde.kdenlive"
          - id: "remove-app"
            label: "Remove Kdenlive"
            script: "kantan-app uninstall org.kde.kdenlive"
      - id: "darktable"
        title: "darktable"
        description: "Photo library and RAW developing."
        default: false
        status_script: "kantan-app status org.darktable.Darktable"
        options:
          - id: "uninstall"
            label: "Install darktable"
            script: "kantan-app install org.darktable.Darktable"
          - id: "remove-app"
            label: "Remove darktable"
            script: "kantan-app uninstall org.darktable.Darktable"
      - id: "audacity"
        title: "Audacity"
        description: "Audio recording and editing."
        default: false
        status_script: "kantan-app status org.audacityteam.Audacity"
        options:
          - id: "uninstall"
            label: "Install Audacity"
            script: "kantan-app install org.audacityteam.Audacity"
          - id: "remove-app"
            label: "Remove Audacity"
            script: "kantan-app uninstall org.audacityteam.Audacity"
      - id: "blender"
        title: "Blender"
        description: "3D modelling and animation."
        default: false
        status_script: "kantan-app status org.blender.Blender"
        options:
          - id: "uninstall"
            label: "Install Blender"
            script: "kantan-app install org.blender.Blender"
          - id: "remove-app"
            label: "Remove Blender"
            script: "kantan-app uninstall org.blender.Blender"
      - id: "artcraft"
        title: "ArtCraft"
        description: "Free creative and office apps (still in development). Opens the ArtCraft website, where you can get its launcher."
        default: false
        script: "xdg-open https://getartcraft.com/"
  - title: "Media & Chat"
    description: "Players and messaging"
    actions:
      - id: "vlc"
        title: "VLC"
        description: "Plays almost any video or audio file."
        default: false
        status_script: "kantan-app status org.videolan.VLC"
        options:
          - id: "uninstall"
            label: "Install VLC"
            script: "kantan-app install org.videolan.VLC"
          - id: "remove-app"
            label: "Remove VLC"
            script: "kantan-app uninstall org.videolan.VLC"
      - id: "haruna"
        title: "Haruna"
        description: "A simple, modern video player."
        default: false
        status_script: "kantan-app status org.kde.haruna"
        options:
          - id: "uninstall"
            label: "Install Haruna"
            script: "kantan-app install org.kde.haruna"
          - id: "remove-app"
            label: "Remove Haruna"
            script: "kantan-app uninstall org.kde.haruna"
      - id: "elisa"
        title: "Elisa"
        description: "Music player."
        default: false
        status_script: "kantan-app status org.kde.elisa"
        options:
          - id: "uninstall"
            label: "Install Elisa"
            script: "kantan-app install org.kde.elisa"
          - id: "remove-app"
            label: "Remove Elisa"
            script: "kantan-app uninstall org.kde.elisa"
      - id: "signal"
        title: "Signal"
        description: "Private messaging."
        default: false
        status_script: "kantan-app status org.signal.Signal"
        options:
          - id: "uninstall"
            label: "Install Signal"
            script: "kantan-app install org.signal.Signal"
          - id: "remove-app"
            label: "Remove Signal"
            script: "kantan-app uninstall org.signal.Signal"
      - id: "desktop"
        title: "Telegram"
        description: "Messaging."
        default: false
        status_script: "kantan-app status org.telegram.desktop"
        options:
          - id: "uninstall"
            label: "Install Telegram"
            script: "kantan-app install org.telegram.desktop"
          - id: "remove-app"
            label: "Remove Telegram"
            script: "kantan-app uninstall org.telegram.desktop"
      - id: "teams_for_linux"
        title: "Microsoft Teams"
        description: "Teams for work or school, in its own window (the community Teams for Linux app)."
        default: false
        status_script: "kantan-app status com.github.IsmaelMartinez.teams_for_linux"
        options:
          - id: "uninstall"
            label: "Install Microsoft Teams"
            script: "kantan-app install com.github.IsmaelMartinez.teams_for_linux"
          - id: "remove-app"
            label: "Remove Microsoft Teams"
            script: "kantan-app uninstall com.github.IsmaelMartinez.teams_for_linux"
      - id: "discord"
        title: "Discord"
        description: "Voice, video and text chat for friends and gaming groups."
        default: false
        status_script: "kantan-app status com.discordapp.Discord"
        options:
          - id: "uninstall"
            label: "Install Discord"
            script: "kantan-app install com.discordapp.Discord"
          - id: "remove-app"
            label: "Remove Discord"
            script: "kantan-app uninstall com.discordapp.Discord"
      - id: "zapzap"
        title: "WhatsApp (ZapZap)"
        description: "WhatsApp in its own window, with notifications. Link it to your phone once by scanning the code with WhatsApp (Settings → Linked devices)."
        default: false
        status_script: "kantan-app status com.rtosta.zapzap"
        options:
          - id: "uninstall"
            label: "Install WhatsApp (ZapZap)"
            script: "kantan-app install com.rtosta.zapzap"
          - id: "remove-app"
            label: "Remove WhatsApp (ZapZap)"
            script: "kantan-app uninstall com.rtosta.zapzap"
  - title: "Windows"
    description: "Windows programs"
    actions:
      - id: "notepadpp"
        title: "Notepad++"
        description: "The Windows Notepad++ text editor, downloaded from its official page and installed in your Windows programs."
        default: false
        script: "nohup setsid /usr/libexec/kantanos/task-window --title Notepad++ --doing 'Downloading and installing Notepad++' --done 'Notepad++ is installed. It'\"'\"'s in the app menu.' --failed 'Notepad++ couldn'\"'\"'t be installed' -- kantan-windows install-notepadpp >&/dev/null"
      - id: "cdrive"
        title: "Open the C: drive"
        description: "Program Files and the other folders your Windows programs use. It is also in the Files sidebar as \"C: (Windows)\"."
        default: false
        script: "nohup setsid kantan-windows c-drive >&/dev/null"
      - id: "winhow"
        title: "Install any Windows program"
        description: "Download its installer (.exe or .msi) and double-click it in Files. It then appears in the app menu and in search (Win+Space). Most programs work; the rest need the Windows virtual machine below."
        default: false
        script: "nohup setsid xdg-open \"$HOME/Downloads\" >&/dev/null"
      - id: "winvm"
        title: "Windows virtual machine"
        description: "Real Windows 11 inside KantanOS, for programs that don't work otherwise; they open as normal windows. Needs the Windows 11 ISO from Microsoft and a Windows 11 Pro licence. Once set up, this opens Windows or lets you manage it."
        default: false
        script: "nohup setsid kantan-windows vm setup >&/dev/null"
      - id: "winecfg"
        title: "Windows settings"
        description: "Advanced: Windows version, drives and graphics settings for your Windows programs (Wine settings)."
        default: false
        script: "nohup setsid kantan-windows settings >&/dev/null"
  - title: "Games"
    description: "Game stores and classic consoles"
    actions:
      - id: "hgl"
        title: "Heroic Games Launcher"
        description: "Epic Games Store, GOG and Amazon Prime Gaming. Games you install appear in Game Mode by themselves, with their box art."
        default: false
        status_script: "kantan-app status com.heroicgameslauncher.hgl"
        options:
          - id: "uninstall"
            label: "Install Heroic Games Launcher"
            script: "kantan-app install com.heroicgameslauncher.hgl"
          - id: "remove-app"
            label: "Remove Heroic Games Launcher"
            script: "kantan-app uninstall com.heroicgameslauncher.hgl"
      - id: "lutris"
        title: "EA app, Ubisoft Connect, Battle.net"
        description: "Lutris is already installed. Search for the store in Lutris and choose Install; it then adds its games to your library. Games with anti-cheat may not run on Linux."
        default: false
        script: "nohup setsid lutris >&/dev/null"
      - id: "gamemode"
        title: "Open Game Mode"
        description: "Your whole library, full screen, for a controller (Steam Big Picture)."
        default: false
        script: "nohup setsid steam steam://open/bigpicture >&/dev/null"
      - id: "restartwin"
        title: "Restart into Windows"
        description: "For games whose anti-cheat only works on real Windows (when Windows is installed on this PC). Windows starts once; the next restart is KantanOS again. Also a tile on the \"What would you like to do?\" screen."
        default: false
        script: "nohup setsid /usr/libexec/kantanos/restart-windows >&/dev/null"
  - title: "Tools"
    description: "Disk space and system helpers"
    actions:
      - id: "filelight"
        title: "Show folder sizes"
        description: "See what is filling your drive as a ring chart (Filelight). In Files you can also right-click any folder and choose Show Folder Sizes."
        default: false
        script: "nohup setsid filelight \"$HOME\" >&/dev/null"
      - id: "forcequit"
        title: "Force quit an app"
        description: "End an app that has stopped responding. Shortcut: Ctrl+Alt+Esc."
        default: false
        script: "nohup setsid /usr/libexec/kantanos/force-quit >&/dev/null"
      - id: "helper"
        title: "Something not working? Ask the KantanOS Helper"
        description: "Looks at what went wrong, explains it in plain words and offers safe fixes, asking before each one. Its AI runs on this PC (set it up once in AI settings) or, if you choose, an online service."
        default: false
        script: "nohup setsid /usr/libexec/kantanos/helper >&/dev/null"
      - id: "kanchan"
        title: "Meet Kan-chan, your PC companion"
        description: "Chat with Kan-chan by talking or typing. She remembers what you tell her (you can see, change or delete it all in \"What I remember\"), suggests what to cook and keeps you company. Everything stays on this PC. Adds her to the app menu."
        default: false
        script: "nohup setsid /usr/libexec/kantanos/kanchan --enable >&/dev/null"
      - id: "docs"
        title: "Letters and documents"
        description: "Open a letter, bill or form (PDF, scan or photo) and get it in plain words: what it says, what you need to do and by when, and anything that looks like a scam. Checks your own writing too, and reads anything aloud. The AI runs on this PC."
        default: false
        script: "nohup setsid kantan-docs >&/dev/null"
      - id: "pictures"
        title: "Picture helper"
        description: "Hear what's in a picture: the AI on this PC describes it in plain words (people, place, colours, any writing) and answers questions about it. It can also look through your photos once, so typing \"beach\" or \"birthday cake\" finds them. Photos never leave this PC."
        default: false
        script: "nohup setsid kantan-pictures >&/dev/null"
      - id: "recipes"
        title: "Recipe book"
        description: "Keep the family's recipes in one place: type them in, bring them from a website, or take them from a photo of a cookbook page. Change how many a recipe serves, then cook from big step-by-step pages with timers, read aloud if you like."
        default: false
        script: "nohup setsid kantan-recipes >&/dev/null"
      - id: "access"
        title: "Make the PC easier to see and hear"
        description: "Screen reader (reads the screen out loud), everything bigger, bigger text and mouse pointer, a magnifier. Kan-chan can also read your email out loud and remind you about appointments."
        default: false
        script: "nohup setsid /usr/libexec/kantanos/accessibility >&/dev/null"
      - id: "claudecode"
        title: "Install Claude Code"
        description: "Claude's coding assistant for the terminal, from Anthropic's official installer. Needs a Claude account. It goes into your home folder, so updates to KantanOS don't affect it."
        default: false
        script: "curl -fsSL https://claude.ai/install.sh | bash; echo; echo \"Press Enter to close...\"; read -r _"
      - id: "backups"
        title: "Back up your files (recommended)"
        description: "Set it up once: choose a USB drive, your NAS, Google Drive or OneDrive, and your documents, photos, music and videos are backed up every 30 minutes, locked with your own backup key. Getting files back is in the same place."
        default: false
        script: "nohup setsid /usr/libexec/kantanos/backup --setup >&/dev/null"
      - id: "virusscan"
        title: "Scan Downloads for viruses"
        description: "Checks your Downloads folder with ClamAV. To check anything else, right-click it in Files and choose Scan for viruses."
        default: false
        script: "nohup setsid /usr/libexec/kantanos/virus-scan >&/dev/null"
      - id: "viruswatch"
        title: "Check new downloads for viruses"
        description: "Off unless you turn it on. Each time something finishes downloading it is checked with ClamAV, and you only hear about it when a virus is found. Each check briefly uses about 1 GB of memory, which can slow down an older PC. Here you can turn it on or off."
        default: false
        script: "nohup setsid /usr/libexec/kantanos/virus-scan --auto-setting >&/dev/null"
      - id: "quarantine"
        title: "Virus quarantine"
        description: "Files flagged as viruses are kept here, where they can't be opened. Now and then a safe file is flagged by mistake: if you trust where it came from, you can put it back."
        default: false
        script: "nohup setsid /usr/libexec/kantanos/virus-scan --quarantine >&/dev/null"
      - id: "siteblock"
        title: "Block bad sites"
        description: "KantanOS keeps this PC away from sites known for viruses, scams, tracking and adverts, in every browser. Here you can turn off one kind of blocking (for example shop and deal links), always allow a site you trust, or check why a site won't open. Changes need the PC's password."
        default: false
        script: "nohup setsid /usr/libexec/kantanos/site-blocker >&/dev/null"
      - id: "fixdock"
        title: "Dock or screen missing?"
        description: "Puts the dock back, and lists the screens KantanOS sees (an AV receiver on HDMI can count as a screen). To choose the main screen: System Settings → Display & Monitor."
        default: false
        script: "nohup setsid /usr/libexec/kantanos/task-window --title 'Dock or screen missing?' --doing 'Putting the dock back' --done 'The dock is back. These are the screens KantanOS sees:' --failed 'That didn'\"'\"'t work.' --show-output -- bash -c 'ujust kantan-reset-dock && ujust kantan-display-info' >&/dev/null"
      - id: "qdirstat"
        title: "QDirStat"
        description: "See which folders use the most space, as a sorted list (like TreeSize on Windows)."
        default: false
        status_script: "kantan-app status com.github.shundhammer.qdirstat"
        options:
          - id: "uninstall"
            label: "Install QDirStat"
            script: "kantan-app install com.github.shundhammer.qdirstat"
          - id: "remove-app"
            label: "Remove QDirStat"
            script: "kantan-app uninstall com.github.shundhammer.qdirstat"
      - id: "alpaca"
        title: "Alpaca (AI chat on this PC)"
        description: "Chat with an AI that runs on this PC: recipes, letters, checking documents, questions. Private and free. To share the Helper's AI, add the instance http://127.0.0.1:11434 in Alpaca's settings."
        default: false
        status_script: "kantan-app status com.jeffser.Alpaca"
        options:
          - id: "uninstall"
            label: "Install Alpaca (AI chat on this PC)"
            script: "kantan-app install com.jeffser.Alpaca"
          - id: "remove-app"
            label: "Remove Alpaca (AI chat on this PC)"
            script: "kantan-app uninstall com.jeffser.Alpaca"
      - id: "dejadup"
        title: "Déjà Dup Backups"
        description: "Automatic backups of your files to Google Drive, OneDrive, the NAS or a USB drive, and getting them back. The simplest choice."
        default: false
        status_script: "kantan-app status org.gnome.DejaDup"
        options:
          - id: "uninstall"
            label: "Install Déjà Dup Backups"
            script: "kantan-app install org.gnome.DejaDup"
          - id: "remove-app"
            label: "Remove Déjà Dup Backups"
            script: "kantan-app uninstall org.gnome.DejaDup"
      - id: "pikabackup"
        title: "Pika Backup"
        description: "Backups as often as every hour to the NAS or a USB drive, with older versions of every file to go back to."
        default: false
        status_script: "kantan-app status org.gnome.World.PikaBackup"
        options:
          - id: "uninstall"
            label: "Install Pika Backup"
            script: "kantan-app install org.gnome.World.PikaBackup"
          - id: "remove-app"
            label: "Remove Pika Backup"
            script: "kantan-app uninstall org.gnome.World.PikaBackup"
  - title: "Display & Sound"
    description: "HDR and surround sound"
    actions:
      - id: "hdr-on"
        title: "Turn HDR on"
        description: "Enables HDR and wide colour on every connected display that supports it."
        default: false
        script: "nohup setsid /usr/libexec/kantanos/task-window --title 'Turn HDR on' --doing 'Turning HDR on' --done 'HDR is on for every screen that supports it.' --failed 'That didn'\"'\"'t work.' --show-output -- ujust kantan-hdr-on >&/dev/null"
      - id: "hdr-off"
        title: "Turn HDR off"
        description: "Switches every display back to standard colour."
        default: false
        script: "nohup setsid /usr/libexec/kantanos/task-window --title 'Turn HDR off' --doing 'Turning HDR off' --done 'HDR is off.' --failed 'That didn'\"'\"'t work.' -- ujust kantan-hdr-off >&/dev/null"
      - id: "audio-71"
        title: "Use 7.1 surround over HDMI"
        description: "For an AV receiver. Turn the receiver on first. Heights are added by the receiver's upmixer."
