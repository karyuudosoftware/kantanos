            label: "Install Krita"
            script: "kantan-app install org.kde.krita"
          - id: "uninstall"
            label: "Remove Krita"
            script: "kantan-app uninstall org.kde.krita"
      - id: "gimp"
        title: "GIMP"
        description: "Photo editing."
        default: false
        status_script: "kantan-app status org.gimp.GIMP"
        options:
          - id: "install"
            label: "Install GIMP"
            script: "kantan-app install org.gimp.GIMP"
          - id: "uninstall"
            label: "Remove GIMP"
            script: "kantan-app uninstall org.gimp.GIMP"
      - id: "inkscape"
        title: "Inkscape"
