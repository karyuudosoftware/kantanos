title: KantanOS Welcome
screens:
  - title: "Welcome!"
    description: "Get started with KantanOS"
    hidden: true
    actions:
      - id: "store"
        title: "Open the app store"
        description: "Browse and install thousands of apps."
        default: false
        script: "nohup setsid gtk4-launch io.github.kolunmi.Bazaar >&/dev/null"
      - id: "japanese"
        title: "Type in Japanese"
        description: "Japanese input is already installed. Press Ctrl+Space in any text box to switch between English and Japanese."
        default: false
        script: "nohup setsid fcitx5-configtool >&/dev/null"
      - id: "phone"
        title: "Connect your Android phone"
        description: "See phone notifications on the PC, share files and the clipboard, use the phone as a remote. Install KDE Connect on the phone from the Play Store, then pair it here."
        default: false
        script: "nohup setsid kdeconnect-app >&/dev/null"
      - id: "nas"
        title: "Connect your NAS"
        description: "Make the shared folders on your NAS (for example a TrueNAS box) work like normal folders in every app. Asks for the NAS user name and password once."
        default: false
        script: "ujust kantan-nas-connect; echo; echo \"Press Enter to close...\"; read -r _"
      - id: "wake"
        title: "Wake this PC from another device"
        description: "Shows the details a wake-up app needs to switch this PC on over the network (Wake-on-LAN)."
        default: false
        script: "ujust kantan-wake-info; echo; echo \"Press Enter to close...\"; read -r _"
      - id: "update"
        title: "Check for updates"
        description: "Update KantanOS and your apps. A restart applies system updates; the previous version stays available as a fallback."
        default: false
        script: "ujust update; echo; echo \"Press Enter to close...\"; read -r _"
      - id: "about"
        title: "About this PC"
        description: "Show the KantanOS version and system details."
        default: false
        script: "nohup setsid kinfocenter >&/dev/null"
  - title: "Look"
    description: "Pick a colour style. It changes the wallpaper, colours and icons straight away."
    actions:
      - id: "look-light"
        title: "Light"
        description: "Light style. This is the one KantanOS starts with."
        default: false
        script: "kantan-look set light"
      - id: "look-sakura"
        title: "Sakura"
        description: "Light style."
        default: false
        script: "kantan-look set sakura"
      - id: "look-graphite"
        title: "Graphite"
        description: "Dark style."
        default: false
        script: "kantan-look set graphite"
      - id: "look-ocean"
        title: "Ocean"
        description: "Dark style."
        default: false
        script: "kantan-look set ocean"
      - id: "look-forest"
        title: "Forest"
        description: "Dark style."
        default: false
        script: "kantan-look set forest"
      - id: "look-ember"
        title: "Ember"
        description: "Dark style."
        default: false
        script: "kantan-look set ember"
      - id: "look-aurora"
        title: "Aurora"
        description: "Dark style."
        default: false
        script: "kantan-look set aurora"
  - title: "Office"
    description: "Documents, notes and email"
    actions:
      - id: "libreoffice"
        title: "LibreOffice"
        description: "Word processor, spreadsheets and presentations. Opens and saves Microsoft Office files."
        default: false
        status_script: "kantan-app status org.libreoffice.LibreOffice"
        options:
          - id: "uninstall"
            label: "Install LibreOffice"
            script: "kantan-app install org.libreoffice.LibreOffice"
          - id: "remove-app"
            label: "Remove LibreOffice"
            script: "kantan-app uninstall org.libreoffice.LibreOffice"
      - id: "notepadnext"
        title: "NotepadNext"
        description: "A Notepad++ style text editor that runs natively."
        default: false
        status_script: "kantan-app status com.github.dail8859.NotepadNext"
        options:
          - id: "uninstall"
            label: "Install NotepadNext"
            script: "kantan-app install com.github.dail8859.NotepadNext"
          - id: "remove-app"
            label: "Remove NotepadNext"
            script: "kantan-app uninstall com.github.dail8859.NotepadNext"
      - id: "thunderbird"
        title: "Thunderbird"
        description: "Email and calendar."
        default: false
        status_script: "kantan-app status org.mozilla.Thunderbird"
        options:
          - id: "uninstall"
            label: "Install Thunderbird"
            script: "kantan-app install org.mozilla.Thunderbird"
          - id: "remove-app"
            label: "Remove Thunderbird"
            script: "kantan-app uninstall org.mozilla.Thunderbird"
  - title: "Creative"
    description: "Photos, drawing, video and audio"
    actions:
      - id: "krita"
        title: "Krita"
        description: "Digital painting and drawing."
        default: false
        status_script: "kantan-app status org.kde.krita"
        options:
          - id: "uninstall"
            label: "Install Krita"
            script: "kantan-app install org.kde.krita"
          - id: "remove-app"
            label: "Remove Krita"
            script: "kantan-app uninstall org.kde.krita"
      - id: "gimp"
        title: "GIMP"
        description: "Photo editing."
        default: false
        status_script: "kantan-app status org.gimp.GIMP"
        options:
          - id: "uninstall"
            label: "Install GIMP"
            script: "kantan-app install org.gimp.GIMP"
          - id: "remove-app"
            label: "Remove GIMP"
            script: "kantan-app uninstall org.gimp.GIMP"
      - id: "inkscape"
        title: "Inkscape"
        description: "Vector illustration."
        default: false
        status_script: "kantan-app status org.inkscape.Inkscape"
        options:
          - id: "uninstall"
            label: "Install Inkscape"
            script: "kantan-app install org.inkscape.Inkscape"
          - id: "remove-app"
            label: "Remove Inkscape"
            script: "kantan-app uninstall org.inkscape.Inkscape"
      - id: "kdenlive"
        title: "Kdenlive"
        description: "Video editing."
        default: false
        status_script: "kantan-app status org.kde.kdenlive"
        options:
          - id: "uninstall"
            label: "Install Kdenlive"
            script: "kantan-app install org.kde.kdenlive"
          - id: "remove-app"
            label: "Remove Kdenlive"
            script: "kantan-app uninstall org.kde.kdenlive"
      - id: "darktable"
        title: "darktable"
        description: "Photo library and RAW developing."
        default: false
        status_script: "kantan-app status org.darktable.Darktable"
        options:
          - id: "uninstall"
            label: "Install darktable"
            script: "kantan-app install org.darktable.Darktable"
          - id: "remove-app"
            label: "Remove darktable"
            script: "kantan-app uninstall org.darktable.Darktable"
      - id: "audacity"
        title: "Audacity"
        description: "Audio recording and editing."
        default: false
        status_script: "kantan-app status org.audacityteam.Audacity"
        options:
          - id: "uninstall"
            label: "Install Audacity"
            script: "kantan-app install org.audacityteam.Audacity"
          - id: "remove-app"
            label: "Remove Audacity"
            script: "kantan-app uninstall org.audacityteam.Audacity"
      - id: "blender"
        title: "Blender"
        description: "3D modelling and animation."
        default: false
        status_script: "kantan-app status org.blender.Blender"
        options:
          - id: "uninstall"
            label: "Install Blender"
            script: "kantan-app install org.blender.Blender"
          - id: "remove-app"
            label: "Remove Blender"
            script: "kantan-app uninstall org.blender.Blender"
      - id: "artcraft"
        title: "ArtCraft"
        description: "Free creative and office apps (still in development). Opens the ArtCraft website, where you can get its launcher."
        default: false
        script: "xdg-open https://getartcraft.com/"
  - title: "Media & Chat"
    description: "Players and messaging"
    actions:
      - id: "vlc"
        title: "VLC"
        description: "Plays almost any video or audio file."
        default: false
        status_script: "kantan-app status org.videolan.VLC"
        options:
          - id: "uninstall"
            label: "Install VLC"
            script: "kantan-app install org.videolan.VLC"
          - id: "remove-app"
            label: "Remove VLC"
            script: "kantan-app uninstall org.videolan.VLC"
      - id: "haruna"
        title: "Haruna"
        description: "A simple, modern video player."
        default: false
        status_script: "kantan-app status org.kde.haruna"
        options:
          - id: "uninstall"
            label: "Install Haruna"
            script: "kantan-app install org.kde.haruna"
          - id: "remove-app"
            label: "Remove Haruna"
            script: "kantan-app uninstall org.kde.haruna"
      - id: "elisa"
        title: "Elisa"
        description: "Music player."
        default: false
        status_script: "kantan-app status org.kde.elisa"
        options:
          - id: "uninstall"
            label: "Install Elisa"
            script: "kantan-app install org.kde.elisa"
          - id: "remove-app"
            label: "Remove Elisa"
            script: "kantan-app uninstall org.kde.elisa"
      - id: "signal"
        title: "Signal"
        description: "Private messaging."
        default: false
        status_script: "kantan-app status org.signal.Signal"
        options:
          - id: "uninstall"
            label: "Install Signal"
            script: "kantan-app install org.signal.Signal"
          - id: "remove-app"
            label: "Remove Signal"
            script: "kantan-app uninstall org.signal.Signal"
      - id: "desktop"
        title: "Telegram"
        description: "Messaging."
        default: false
        status_script: "kantan-app status org.telegram.desktop"
        options:
          - id: "uninstall"
            label: "Install Telegram"
            script: "kantan-app install org.telegram.desktop"
          - id: "remove-app"
            label: "Remove Telegram"
            script: "kantan-app uninstall org.telegram.desktop"
  - title: "Windows"
    description: "Windows programs"
    actions:
      - id: "notepadpp"
        title: "Notepad++"
        description: "The Windows Notepad++ text editor, downloaded from its official page and installed in your Windows programs."
        default: false
        script: "kantan-windows install-notepadpp; echo; echo \"Press Enter to close...\"; read -r _"
      - id: "cdrive"
        title: "Open the C: drive"
        description: "Program Files and the other folders your Windows programs use. It is also in the Files sidebar as \"C: (Windows)\"."
        default: false
        script: "nohup setsid kantan-windows c-drive >&/dev/null"
      - id: "winhow"
        title: "Install any Windows program"
        description: "Download its installer (.exe or .msi) and double-click it in Files. It then appears in the app menu and in search (Win+Space). Most programs work; some need the Windows virtual machine (coming later)."
        default: false
        script: "nohup setsid xdg-open \"$HOME/Downloads\" >&/dev/null"
      - id: "winecfg"
        title: "Windows settings"
        description: "Advanced: Windows version, drives and graphics settings for your Windows programs (Wine settings)."
        default: false
        script: "nohup setsid kantan-windows settings >&/dev/null"
  - title: "Games"
    description: "Game stores and classic consoles"
    actions:
      - id: "hgl"
        title: "Heroic Games Launcher"
        description: "Epic Games Store, GOG and Amazon Prime Gaming. In Heroic, open a game's menu and choose \"Add to Steam\" to see it in Game Mode."
        default: false
        status_script: "kantan-app status com.heroicgameslauncher.hgl"
        options:
          - id: "uninstall"
            label: "Install Heroic Games Launcher"
            script: "kantan-app install com.heroicgameslauncher.hgl"
          - id: "remove-app"
            label: "Remove Heroic Games Launcher"
            script: "kantan-app uninstall com.heroicgameslauncher.hgl"
      - id: "retrodeck"
        title: "RetroDECK"
        description: "Classic consoles in one app (the Retro Games tile). You supply your own game files; it can read them from the NAS."
        default: false
        status_script: "kantan-app status net.retrodeck.retrodeck"
        options:
          - id: "uninstall"
            label: "Install RetroDECK"
            script: "kantan-app install net.retrodeck.retrodeck"
          - id: "remove-app"
            label: "Remove RetroDECK"
            script: "kantan-app uninstall net.retrodeck.retrodeck"
      - id: "lutris"
        title: "EA app, Ubisoft Connect, Battle.net"
        description: "Lutris is already installed. Search for the store in Lutris and choose Install; it then adds its games to your library. Games with anti-cheat may not run on Linux."
        default: false
        script: "nohup setsid lutris >&/dev/null"
      - id: "gamemode"
        title: "Open Game Mode"
        description: "Your whole library, full screen, for a controller (Steam Big Picture)."
        default: false
        script: "nohup setsid steam steam://open/bigpicture >&/dev/null"
  - title: "Tools"
    description: "Disk space and system helpers"
    actions:
      - id: "filelight"
        title: "Show folder sizes"
        description: "See what is filling your drive as a ring chart (Filelight). In Files you can also right-click any folder and choose Show Folder Sizes."
        default: false
        script: "nohup setsid filelight \"$HOME\" >&/dev/null"
      - id: "forcequit"
        title: "Force quit an app"
        description: "End an app that has stopped responding. Shortcut: Ctrl+Alt+Esc."
        default: false
        script: "nohup setsid /usr/libexec/kantanos/force-quit >&/dev/null"
      - id: "qdirstat"
        title: "QDirStat"
        description: "See which folders use the most space, as a sorted list (like TreeSize on Windows)."
        default: false
        status_script: "kantan-app status com.github.shundhammer.qdirstat"
        options:
          - id: "uninstall"
            label: "Install QDirStat"
            script: "kantan-app install com.github.shundhammer.qdirstat"
          - id: "remove-app"
            label: "Remove QDirStat"
            script: "kantan-app uninstall com.github.shundhammer.qdirstat"
  - title: "Display & Sound"
    description: "HDR and surround sound"
    actions:
      - id: "hdr-on"
        title: "Turn HDR on"
        description: "Enables HDR and wide colour on every connected display that supports it."
        default: false
        script: "ujust kantan-hdr-on; echo; echo \"Press Enter to close...\"; read -r _"
      - id: "hdr-off"
        title: "Turn HDR off"
        description: "Switches every display back to standard colour."
        default: false
        script: "ujust kantan-hdr-off; echo; echo \"Press Enter to close...\"; read -r _"
      - id: "audio-71"
        title: "Use 7.1 surround over HDMI"
        description: "For an AV receiver. Turn the receiver on first. Heights are added by the receiver's upmixer."
        default: false
        script: "ujust kantan-audio-71; echo; echo \"Press Enter to close...\"; read -r _"
