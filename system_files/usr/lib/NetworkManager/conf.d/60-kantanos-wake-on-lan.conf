# KantanOS: wired network ports listen for Wake-on-LAN "magic packets", so the PC can be
# switched on from a phone or another computer. The BIOS must allow it too (often called
# "Wake on LAN" or "Power On By PCI-E", with "ErP" switched off). Details: ujust kantan-wake-info
[connection]
ethernet.wake-on-lan=magic
