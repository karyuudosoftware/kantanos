# KantanOS: only on PCs with an NVIDIA graphics card (PCI vendor 0x10de, display class 0x03).
# Elsewhere it failed at every start, and the Helper listed it as a problem.
[Service]
ExecCondition=/bin/sh -c 'for d in /sys/bus/pci/devices/*; do [ "$(cat "$d/vendor")" = 0x10de ] && case "$(cat "$d/class")" in 0x03*) exit 0 ;; esac; done; exit 1'
