# KantanOS: step in sooner when memory runs out. Without this, a PC that fills its memory
# (a game, a browser with many tabs and the local AI at once) freezes for minutes before
# anything gives way. Fedora's default waits for 20 seconds of 80% stall; a desktop is
# unusable long before that. Now the app using the most memory is closed after 10 seconds
# of heavy stalling, or once the memory overflow (zram swap) is 85% full, and
# kantanos-memory-notice says which app it was, in plain words.
[OOM]
SwapUsedLimit=85%
DefaultMemoryPressureLimit=50%
DefaultMemoryPressureDurationSec=10s
