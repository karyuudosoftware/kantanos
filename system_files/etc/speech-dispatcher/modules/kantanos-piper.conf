# KantanOS: the natural Piper voice for the screen reader (and anything else that speaks through
# speech-dispatcher). /usr/libexec/kantanos/piper-speech keeps the voice loaded so it answers
# quickly, and falls back to espeak-ng when the voice hasn't been downloaded.

GenericExecuteSynth \
"printf %s \'$DATA\' | /usr/libexec/kantanos/piper-speech say --rate $RATE --pitch $PITCH"

GenericCmdDependency "/usr/libexec/kantanos/piper-speech"
GenericSoundIconFolder "/usr/share/sounds/sound-icons/"

GenericRateAdd 0
GenericRateMultiply 1
GenericPitchAdd 0
GenericPitchMultiply 1

AddVoice "en" "FEMALE1" "hfc_female"
DefaultVoice "hfc_female"
