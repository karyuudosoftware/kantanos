# KantanOS: let apps get the location on the KDE desktop.
#
# Flatpak apps (most weather apps) ask through the desktop portal. GNOME shows a "share your
# location?" prompt for that; KDE has no such prompt, so without these lines the request
# quietly fails and weather apps can't find where you are. For a fixed, exact location
# (better for a desktop PC on a cable), run: ujust kantan-set-location

[xdg-desktop-portal]
allowed=true
system=true
users=

[org.kde.kweather]
allowed=true
system=false
users=

[org.gnome.Weather]
allowed=true
system=false
users=

# The KantanOS Weather widget in the top bar (it runs inside plasmashell)
[org.kde.plasmashell]
allowed=true
system=true
users=
